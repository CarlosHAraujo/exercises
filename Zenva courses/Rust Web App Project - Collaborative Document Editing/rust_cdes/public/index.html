<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust websocket app</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A simple web application using Rust and WebSockets">
    <meta name="keywords" content="web, app, example">
    <meta name="author" content="Carlos Araujo">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script>
      var last_update = 0;
      var last_delta = {};
      var ws = new WebSocket('ws://127.0.0.1:8080/ws/');
      ws.onopen = function() {
        console.log('WebSocket connection established');
      };      
      ws.onclose = function() {
        console.log('WebSocket connection closed');
      };
      ws.onerror = function(error) {
        console.error('WebSocket error:', error);
      };
      
      // Initialize quill after dom is ready
      document.addEventListener('DOMContentLoaded', function() {
        var toolbarOptions = ['bold', 'italic', 'underline'];

        const quill = new Quill('#editor', {
          theme: 'snow',
          modules: {
            toolbar: toolbarOptions
          }
        });

        quill.on('text-change', function(delta, oldDelta, source) {
          last_update = Date.now();
            last_delta = delta;

            let obj = {
                time: last_update,
                delta: delta
            };

            if(source == 'user') {
                console.log(JSON.stringify(obj));
                ws.send(JSON.stringify(obj));
            }
        });

        ws.onmessage = function(event) {
        try {
          let obj = JSON.parse(event.data);
          console.log('Message from server:', obj);
          let time = obj.time;
          let delta = obj.delta;
          
          if (last_update < time) {
            quill.updateContents(delta);
          } else {
            console.warn('Received outdated update, ignoring');
          }

          last_update = Math.max(last_update, time);
        } catch (error) {
          console.error('Error processing message:', error);
        }
      };
      });      
    </script>
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
      }
      header {
        background-color: #6200ea;
        color: white;
        padding: 20px;
        text-align: center;
      }
      main {
        padding: 20px;
      }
      footer {
        background-color: #6200ea;
        color: white;
        text-align: center;
        padding: 10px;
        position: fixed;
        width: 100%;
        bottom: 0;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Welcome to the Rust WebSocket App</h1>
      <p>Collaborative text editor using Rust and WebSockets</p>
    </header>
    <main>
      <div id="editor">
      </div>
    </main>
    <footer>
      <p>&copy; 2025 Carlos Araujo</p>
      <p>Powered by Rust and WebSockets</p>
    </footer>
  </body>
</html>
